[pytest]
# jr/ is intentionally excluded: it's a standalone agent with its own isolated
# .venv (jr/.venv, includes agno) and its tests only run there — see jr/daily.sh.
# This mirrors .github/workflows/validate.yml's `tests` job exactly.
testpaths =
    apps/core/tests
    apps/api/tests
    apps/cli/tests
markers =
    inference: exercises REAL Groq inference (live HTTP endpoint or a real GroqClient) -- needs ESP_ATLAS_API or GROQ_API_KEY, network, and is non-deterministic. Not part of the blocking CI job; run on demand with `make inference-oracle` or `pytest -m inference`.
