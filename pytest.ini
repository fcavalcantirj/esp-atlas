[pytest]
# jr/ and scripts/ were excluded here for as long as they ran only inside jr/.venv. They now
# run in CI too, as the `jr-tests` job in .github/workflows/validate.yml, because a green
# apps/ suite said nothing about the agent that WRITES apps/'s data -- the fork gate was dead
# in production for weeks while its unit tests passed. agno-dependent tests skip via
# importorskip when that package is absent, so this works with or without jr/.venv.
testpaths =
    apps/core/tests
    apps/api/tests
    apps/cli/tests
    jr
    scripts
markers =
    inference: exercises REAL Groq inference (live HTTP endpoint or a real GroqClient) -- needs ESP_ATLAS_API or GROQ_API_KEY, network, and is non-deterministic. Not part of the blocking CI job; run on demand with `make inference-oracle` or `pytest -m inference`.
