[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "esp-atlas-cli"
version = "0.1.0"
description = "esp-atlas CLI: search, wizard, and ask over the esp-atlas ESP32 dataset"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "esp-atlas-core",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
esp-atlas = "esp_atlas_cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
