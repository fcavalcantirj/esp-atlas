[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "esp-atlas-core"
version = "0.1.0"
description = "esp-atlas agent-core: index build, search, wizard, and grounded ask() over the esp-atlas dataset"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "httpx>=0.27",
    "jsonschema>=4.0",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "inference: exercises REAL Groq inference (live HTTP endpoint or a real GroqClient) -- needs ESP_ATLAS_API or GROQ_API_KEY, network, and is non-deterministic. Not part of the blocking CI job; run on demand with `make inference-oracle` or `pytest -m inference`.",
]
