name: jr-data-merge
# The one serialized merger of Jr's data PRs (scripts/data_merge.py; Jr redesign plan, step 6). Level-triggered:
# every run re-reads the open jr-data / jr-quarantine PRs and main, so a replaced or cancelled run loses nothing.
# APPLY (2026-11-26): it merges what its own switches allow (jr/autonomy.json backfill_automerge /
# build_target_automerge; JR_TICK_AUTOMERGE=0 kills), each backfill re-derived by main's code first, and
# confirms deployments. The runner's timer may also run it as Jr's bot; the concurrency group serializes both.
on:
  workflow_dispatch:
  workflow_run:
    workflows: [validate]
    types: [completed]
concurrency:
  group: jr-data-merge
  cancel-in-progress: false
permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read
jobs:
  decide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # data_merge imports demand_canary, which reads frontmatter through esp_atlas_core (yaml, jsonschema).
      # 2026-11-23: without this step every run since #2007 failed (ModuleNotFoundError: No module named 'yaml').
      - name: Install what scripts/data_merge.py imports
        run: pip install pyyaml jsonschema httpx pypdf && pip install -e apps/core
      - name: Decide and act on every labelled data PR
        env:
          GH_TOKEN: ${{ github.token }}
          JR_TICK_AUTOMERGE: ${{ vars.JR_TICK_AUTOMERGE }}
        run: python3 scripts/data_merge.py --apply
