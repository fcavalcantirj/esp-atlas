name: validate

on:
  pull_request:
  push:
    branches: [main]
  # A PR merged by a workflow's own token pushes to main without starting any workflow; the canaries start
  # this one by dispatch instead (scripts/validate_main.py). The pull-request-only jobs stay off such a run.
  workflow_dispatch:

jobs:
  schema:
    # REQUIRED status check (branch protection). On pull requests it also runs the new-link
    # check below, so a confirmed-dead link a PR adds blocks merge through this job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the new-link check diffs against the PR's merge base
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema pyyaml
      - name: Validate frontmatter against schema
        run: python3 scripts/validate.py
      - name: Firmware popularity floor gate (fails if any firmware is below both floors)
        run: python3 scripts/firmware_floor_audit.py --ci
      - name: Build index (proves it compiles)
        run: python3 scripts/build_index.py
      - name: G1 board-coverage audit (warn mode — reports firmware whose repo declares boards with no recipe)
        # Reads data/firmware/<id>/signals.json written by Track B (jr/stage_boardmap.py); offline.
        # Becomes blocking (--strict) once the known under-maps are closed.
        run: python3 scripts/firmware_boards_audit.py --ci
      - name: No confirmed-dead link among the URLs this PR adds or changes (PyYAML from above)
        # Inside the required schema check, so a confirmed 404/410 (asked twice) on a URL this
        # PR ADDS or CHANGES under data/** blocks merge. Deliberately no continue-on-error and
        # no pipe: the script's exit code is the verdict. Timeouts, DNS/TLS errors, 429, 5xx
        # and 403 bot walls are inconclusive and exit 0. Untouched lines are never checked, so
        # a link already broken on main does not fail an unrelated PR (sources-live tracks those).
        if: github.event_name == 'pull_request'
        run: python3 scripts/new_link_check.py

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install local packages (core, api, cli)
        run: pip install -e apps/core[test] -e apps/api[test] -e apps/cli[test]
      - name: Run full pytest suite (includes wizard oracle invariants)
        run: python3 -m pytest apps/core/tests apps/api/tests apps/cli/tests
      # The web unit tests (lib/*.test.ts, including the public-copy guard) ride this required
      # job on purpose; scripts/test_validate_workflow.py fails if they move out or go soft.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci
      - name: Run web unit tests (node --test lib/*.test.ts)
        working-directory: apps/web
        run: npm test

  jr-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install what jr/ and scripts/ actually import
        # Deliberately NOT agno: those tests importorskip, so the agent lane stays testable in
        # CI without dragging the whole LLM stack into every run. pytrends IS installed: it's
        # imported at module scope (guarded by its own try/except) and its tests mock it, not
        # importorskip it, since fetch_trends() must degrade gracefully with or without it.
        run: pip install pyyaml jsonschema requests pytest pytrends
      - name: Install the pinned ESP image parser (jr/esp_image.py; esptool's image module only)
        run: pip install -r jr/requirements-image.txt
      - name: Install the pinned PlatformIO (jr/claims_pio.py resolves envs with PlatformIO's own ProjectConfig)
        run: pip install -r jr/requirements-claims.txt
      - name: Install core (jr and scripts import esp_atlas_core)
        run: pip install -e apps/core
      - name: Can this runner build the image sandbox? (bwrap + unprivileged user namespaces)
        # jr/image_sandbox.py runs the parser under bubblewrap. The ubuntu-24.04 image ships no
        # bwrap and restricts unprivileged user namespaces (AppArmor): there this prints
        # "sandbox_unavailable", the FAIL-CLOSED path asserted by jr/test_image_sandbox_fail_closed.py,
        # and the `sandbox`-marked tests SKIP with this reason. The ubuntu-26.04 image (ubuntu-latest
        # from 2026-11-12) ships bwrap and prints "sandbox available": the jail tests run for real.
        run: cd jr && python3 -c "import image_sandbox as sb; print(sb.unavailable_reason() or 'sandbox available')"
      - name: Image sandbox tests (every skip listed with its reason)
        run: python3 -m pytest jr/test_image_sandbox.py jr/test_image_sandbox_fail_closed.py -v -rs
      - name: Run the agent + scripts suites
        run: python3 -m pytest jr scripts -q -rs

  sources-live:
    # NON-BLOCKING tracker of links already broken on main: checks every cited URL, never a
    # required check. No CI bot path commits back to the repo, so its dead list lives in this
    # job's log rather than a tracked report file. PR-added links are the schema job's
    # new-link step above.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx pyyaml
      - name: Check every cited source URL is still live
        run: python3 scripts/check_sources_live.py

  quotes:
    # Every quoted span in a record this PR adds or changes must appear verbatim on a page the record
    # cites (scripts/check_quotes.py): the part of a human review that was still done by hand on
    # 2026-11-17 (#1800), made mechanical so Jr's demand PRs can be judged by a machine. FAIL only when
    # every cited page was readable and none holds the quote; an unreadable page is INCONCLUSIVE and
    # never fails the job (the sources-live rule). Records untouched by the PR are never looked at.
    # pypdf reads the cited datasheet PDFs; without it a PDF-only citation is inconclusive, not wrong.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # diffs against the PR's merge base
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx pyyaml pypdf
      - name: Install core (the check reads frontmatter with esp_atlas_core)
        run: pip install -e apps/core
      - name: Quoted text appears on a cited page (changed records only)
        run: python3 scripts/check_quotes.py

  demand-guard:
    # A jr/research-<KEY> PR (Jr's demand work) changes exactly what its work item says: the queue
    # candidate KEY linked to this PR and nothing else in the two demand files, the catalog records added
    # are exactly its expected_ids with no forbidden sibling anywhere, and the demand files changed only
    # in chore(demand): commits (scripts/demand_guard.py). The part of a demand PR's review that a human
    # did by reading the JSON diff (2026-11-17, #1800), as a job. Other branches: not run.
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'jr/research-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the diff and the commit subjects against the PR's merge base
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Install core (research_work reads the validation receipt)
        run: pip install -e apps/core
      - name: The PR changes exactly what its work item says
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: python3 scripts/demand_guard.py

  demand-canary:
    # The click a person used to make on a demand PR (scripts/demand_canary.py): when every job this one
    # needs is green, jr/autonomy.json says demand_automerge true AND the repository variable
    # JR_DEMAND_AUTOMERGE is not 0 (the kill switch), the quotes re-run here has no FAIL and no
    # INCONCLUSIVE, and no other jr/research-* PR merged today, the PR is marked ready and
    # `gh pr merge --auto --match-head-commit <head>` is requested: it lands only when every required
    # check is green at exactly this head. A quote FAIL gets a comment and the label needs-human instead.
    # The token: the bot's PAT when the secret exists (so the merge triggers main's workflows like a
    # person's merge does), else the workflow token.
    # No `vars.` in this `if`: an UNSET variable compared with '0' is false, which silently skipped every canary
    # (2026-11-19). The script reads JR_DEMAND_AUTOMERGE itself and prints why it is off.
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'jr/research-')
    needs: [schema, tests, jr-tests, quotes, demand-guard, jr-pr-guard, g2-guard, ledger-guard]
    concurrency:
      group: demand-canary   # one at a time, so two runs never both see the daily cap free
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write     # only to start validate on main after a merge (last step)
    steps:
      # main's code decides; the PR is only DATA in pr/ (review BLOCK of #1809, 2026-11-19: with the PR's own
      # checkout, a commit on the branch could rewrite the canary that judges it)
      - uses: actions/checkout@v4
        with:
          # main's TIP, not base.sha: base.sha is main as it was when the PR's head was last synchronized
          # (measured 2026-11-19: a day old on PRs opened the day before), so "main's code decides" ran
          # yesterday's canary on them
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the diff and the switch against the PR's merge base
          path: pr
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx pyyaml pypdf
      - name: Install core (the quotes re-check reads frontmatter with esp_atlas_core)
        run: pip install -e trusted/apps/core
      - name: Decide and, when every switch and check allows, request the merge at the exact head
        env:
          GH_TOKEN: ${{ secrets.ESPATLAS_JR_TOKEN || github.token }}
          JR_DEMAND_AUTOMERGE: ${{ vars.JR_DEMAND_AUTOMERGE }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BRANCH: ${{ github.head_ref }}   # via env, never pasted into the shell (4th review of #1809)
        run: python3 trusted/scripts/demand_canary.py --repo pr --pr "$PR_NUMBER" --head "$PR_HEAD" --branch "$PR_BRANCH"
      - name: main gets its CI even when this job's token merged (a workflow-token push starts no workflow)
        # 2026-11-19: #1799, the first PR the machine merged, left main's new head with zero runs. Dispatch is
        # the documented exception. A PR whose base predates the script has nothing to run and says so.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f trusted/scripts/validate_main.py ]; then python3 trusted/scripts/validate_main.py; else echo "validate-main: this PR's base predates the script; skipped"; fi

  receipt-guard:
    # A jr/tick-* PR: is it mergeable on its evidence receipts alone? Every recipe it adds must carry a PASS
    # receipt (jr/autoreview, SPEC-jr-review-routing 7) that holds again when the checker is re-run here on
    # the live upstream (description, README, platformio.ini, release assets); no existing record edited,
    # nothing deleted, at least one recipe added (scripts/receipt_guard.py). The job only REPORTS (exit 0 either
    # way); the tick canary recomputes eligibility with main's code and is the only consumer.
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'jr/tick-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Install core (the guard reads frontmatter and the board catalog)
        run: pip install -e apps/core
      - name: Every added recipe's PASS receipt holds on the live upstream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # report only: "not eligible" is information for the canary and the reader, never a red X on a PR that
        # is simply waiting for a person (2026-11-19: 3 red runs and 3 failure emails on #1828)
        run: python3 scripts/receipt_guard.py --report-only

  tick-canary:
    # The click a person used to make on a review-routed tick PR (scripts/tick_canary.py): when every job
    # it needs is green, jr/autonomy.json says tick_automerge true AND the repository variable
    # JR_TICK_AUTOMERGE is not 0, the PR carries jr-review, no other review-routed tick PR merged today, and
    # the receipt guard says eligible, `gh pr merge --auto --match-head-commit <head>` is requested.
    # No `vars.` here either (see demand-canary): the script reads JR_TICK_AUTOMERGE.
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'jr/tick-')
    needs: [schema, tests, jr-tests, receipt-guard, jr-pr-guard, g2-guard, ledger-guard]
    concurrency:
      group: tick-canary   # one at a time, so two runs never both see the daily cap free
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write     # only to start validate on main after a merge (last step)
    steps:
      # main's code decides; the PR is only DATA in pr/ (review BLOCK of #1809, 2026-11-19: with the PR's own
      # checkout, a commit on the branch could rewrite the canary that judges it)
      - uses: actions/checkout@v4
        with:
          # main's TIP, not base.sha: base.sha is main as it was when the PR's head was last synchronized
          # (measured 2026-11-19: a day old on PRs opened the day before), so "main's code decides" ran
          # yesterday's canary on them
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the diff and the switch against the PR's merge base
          path: pr
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Install core
        run: pip install -e trusted/apps/core
      - name: Decide and, when every switch and receipt allows, request the merge at the exact head
        env:
          GH_TOKEN: ${{ secrets.ESPATLAS_JR_TOKEN || github.token }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JR_TICK_AUTOMERGE: ${{ vars.JR_TICK_AUTOMERGE }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BRANCH: ${{ github.head_ref }}
        run: python3 trusted/scripts/tick_canary.py --repo pr --pr "$PR_NUMBER" --head "$PR_HEAD" --branch "$PR_BRANCH"
      - name: main gets its CI even when this job's token merged (a workflow-token push starts no workflow)
        # 2026-11-19: #1799, the first PR the machine merged, left main's new head with zero runs. Dispatch is
        # the documented exception. A PR whose base predates the script has nothing to run and says so.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f trusted/scripts/validate_main.py ]; then python3 trusted/scripts/validate_main.py; else echo "validate-main: this PR's base predates the script; skipped"; fi

  g2-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Install core (the guard imports the floor definition)
        run: pip install -e apps/core
      - name: Refuse un-overridden deletions of high-signal firmware (G2)
        run: python3 scripts/g2_guard.py

  ledger-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: A tick PR may add memory, never rewrite it (merged/proposed are never downgraded)
        run: python3 scripts/ledger_guard.py

  jr-pr-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Install core (the guard imports the floor definition)
        run: pip install -e apps/core
      - name: Re-check every ADDED firmware record live (public repo, not a fork, not archived, above the floor, snapshot present)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/jr_pr_guard.py

  jr-lock-install:
    # Recipe/install verification of jr/runtime-lock/ on x86_64 with a CI-built esptool wheel,
    # NOT proof of the Pi archive (aarch64). Downloads hash-pinned wheels + the esptool sdist,
    # builds esptool offline, then installs --no-index --require-hashes and runs negative checks.
    # No env, no secrets: the script is the whole job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Hash-locked offline install of Jr's runtime (x86_64 / CPython 3.12)
        run: bash scripts/ci/jr_lock_install_check.sh
